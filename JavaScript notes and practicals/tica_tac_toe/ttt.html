<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tac-toe</title>
    <style>
        .conatainer {
            display: grid;
            grid-template-columns: auto auto auto;
            background-color: dodgerblue;
            padding: 20px;
        }

        .conatainer div {
            background-color: rgb(235, 244, 244);
            border: 3px solid black;
            padding: 10px;
            font-size: 40px;
            text-align: center;
        }
       
    </style>
</head>
<body>
    <div class="container"> 
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div> 
</body>
</html>
