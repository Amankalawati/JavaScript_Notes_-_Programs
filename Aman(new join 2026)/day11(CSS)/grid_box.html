<!Doctype html>
<html lang="en">
<head>
<title>Grids</title>
<style>
    *{
        margin:0;
        padding:0;
    }
    body{
        width: 100vw;
        height: 100vh;
    }
    .box{
        background-color: rgb(90, 148, 90);
    }
    #header{
        grid-column-start: 1;
        grid-column-end:4 ;
    }
    #side_bar{
        
        grid-row-start: 2;
        grid-row-end:4 ;
    }
    #footer{
        grid-column-start: 1;
        grid-column-end:4 ;
    }
    #content3{
        
        grid-column-start: 2;
        grid-column-end:4 ;
    }
    .container{
        width: 100%;
        height: 100%;
        display:grid;
        grid-template-rows:repeat(4,1fr);
        grid-template-columns: repeat(3,1fr);
        gap: 20px;
    }


</style>
</head>

<body>
<div class = "container">
<div class="box" id="header">Header</div>
<div class="box" id="side_bar">Side Bar</div>
<div class="box" id="content1">content 1</div>
<div class="box" id="content2">content 2</div>
<div class="box" id="content3">content 3</div>
<div class="box" id="footer">Footer</div>
</div>
</body>
</html>
